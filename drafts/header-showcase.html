<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Header Showcase — All Brands</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #fff; }
    
    .showcase-header {
      text-align: center;
      padding: 40px 20px 20px;
    }
    .showcase-header h1 { font-size: 28px; margin-bottom: 8px; }
    .showcase-header p { color: #aaa; font-size: 14px; }
    
    .brand-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
      padding: 24px;
      max-width: 1600px;
      margin: 0 auto;
    }
    
    .brand-card {
      background: #16213e;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #0f3460;
    }
    
    .brand-card-label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: #0f3460;
      font-size: 14px;
      font-weight: 600;
    }
    
    .brand-card-label .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    
    .brand-card-label .url {
      color: #aaa;
      font-weight: 400;
      margin-left: auto;
      font-size: 12px;
    }
    
    .brand-frame {
      position: relative;
      width: 100%;
      height: 180px;
      overflow: hidden;
    }
    
    .brand-frame iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 1440px;
      height: 300px;
      transform-origin: top left;
      transform: scale(var(--iframe-scale, 0.45));
      border: none;
      pointer-events: none;
    }
    
    .expand-btn {
      display: block;
      width: 100%;
      padding: 8px;
      background: #0a1628;
      border: none;
      color: #6c9bff;
      cursor: pointer;
      font-size: 12px;
    }
    .expand-btn:hover { background: #0f3460; }
    
    @media (min-width: 1024px) {
      .brand-grid { grid-template-columns: 1fr 1fr; }
      .brand-frame { height: 160px; }
    }
    
    @media (min-width: 1440px) {
      .brand-frame iframe { transform: scale(0.6); }
      .brand-frame { height: 200px; }
    }
  </style>
</head>
<body>
  <div class="showcase-header">
    <h1>AbbVie EDS — Unified Header Block</h1>
    <p>Same header.js across all brands • CSS-only differentiation • Content-driven utility bar</p>
  </div>

  <div class="brand-grid">
    <!-- RINVOQ DTC -->
    <div class="brand-card">
      <div class="brand-card-label">
        <span class="dot" style="background: rgb(37,40,42)"></span>
        RINVOQ (DTC)
        <span class="url">rinvoq.com</span>
      </div>
      <div class="brand-frame">
        <iframe src="/drafts/nav-preview.html" loading="lazy"></iframe>
      </div>
      <button class="expand-btn" onclick="window.open('/drafts/nav-preview.html','_blank')">Open Full Preview ↗</button>
    </div>

    <!-- RINVOQ HCP -->
    <div class="brand-card">
      <div class="brand-card-label">
        <span class="dot" style="background: rgb(0,0,0)"></span>
        RINVOQ (HCP)
        <span class="url">rinvoqhcp.com</span>
      </div>
      <div class="brand-frame">
        <iframe src="/drafts/header-rinvoq-hcp-preview.html" loading="lazy"></iframe>
      </div>
      <button class="expand-btn" onclick="window.open('/drafts/header-rinvoq-hcp-preview.html','_blank')">Open Full Preview ↗</button>
    </div>

    <!-- SKYRIZI HCP -->
    <div class="brand-card">
      <div class="brand-card-label">
        <span class="dot" style="background: rgb(0,118,175)"></span>
        SKYRIZI (HCP)
        <span class="url">skyrizihcp.com</span>
      </div>
      <div class="brand-frame">
        <iframe src="/drafts/header-skyrizi-hcp-preview.html" loading="lazy"></iframe>
      </div>
      <button class="expand-btn" onclick="window.open('/drafts/header-skyrizi-hcp-preview.html','_blank')">Open Full Preview ↗</button>
    </div>

    <!-- LINZESS -->
    <div class="brand-card">
      <div class="brand-card-label">
        <span class="dot" style="background: rgb(0,115,125)"></span>
        LINZESS
        <span class="url">linzess.com</span>
      </div>
      <div class="brand-frame">
        <iframe src="/drafts/header-linzess-preview.html" loading="lazy"></iframe>
      </div>
      <button class="expand-btn" onclick="window.open('/drafts/header-linzess-preview.html','_blank')">Open Full Preview ↗</button>
    </div>

    <!-- MAVYRET -->
    <div class="brand-card">
      <div class="brand-card-label">
        <span class="dot" style="background: rgb(68,68,68)"></span>
        MAVYRET
        <span class="url">mavyret.com</span>
      </div>
      <div class="brand-frame">
        <iframe src="/drafts/header-mavyret-preview.html" loading="lazy"></iframe>
      </div>
      <button class="expand-btn" onclick="window.open('/drafts/header-mavyret-preview.html','_blank')">Open Full Preview ↗</button>
    </div>
  </div>

  <script>
    // Adjust iframe scale based on container width
    function adjustScales() {
      document.querySelectorAll('.brand-frame').forEach(frame => {
        const w = frame.offsetWidth;
        const scale = w / 1440;
        frame.querySelector('iframe').style.setProperty('--iframe-scale', scale);
        frame.querySelector('iframe').style.transform = `scale(${scale})`;
        frame.style.height = (300 * scale) + 'px';
      });
    }
    window.addEventListener('resize', adjustScales);
    window.addEventListener('load', adjustScales);
  </script>
</body>
</html>
