name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude PR Review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /code-review ${{ github.event.pull_request.number }}

            You are reviewing a Pull Request for an AEM Edge Delivery Services (EDS) multi-brand
            project supporting pharmaceutical brands:
            rinvoq, skyrizi, linzess, venclexta, mavyret, rinvoq-hcp, skyrizi-hcp, abbvie, botox.

            ## Project Structure
            blocks/[name]/[name].js             — core block logic (must be brand-agnostic)
            blocks/[name]/[name].css            — core block styles (must be brand-agnostic)
            blocks/[name]/_[name].json          — Universal Editor model definition
            blocks/[name]/[brand]/[name].css    — brand CSS override (ONLY place for brand styles)
            blocks/[name]/[brand]/[theme].css   — theme override
            scripts/scripts.js                  — page lifecycle
            scripts/aem.js                      — EDS core library (never modify directly)
            scripts/utils.js                    — shared utilities
            styles/tokens.css                   — global design tokens
            styles/styles.css                   — global base styles

            ## Available Blocks
            accordion, anchor-nav, back-to-top, background-video, banner-ad, brand-explorer,
            breadcrumb, brightcove-video, cards, carousel, chart, columns, cta, dismissible,
            doctor-locator, embed, fact-card, footer, form, formulary-lookup, fragment, header,
            hero, hotspot, image-compare, info-tree, linklist, modal, navigation-content,
            safety-bar, search, send-mail, separator, social-media, tabs, teaser, tooltip,
            video, video-playlist

            ---

            Review the diff and post inline comments on the exact lines with issues.
            Check all of the following:

            ### 1. Hard Coding
            - Hard-coded URLs, domain names, or absolute paths (should be relative)
            - Hard-coded hex colors, px values, font names that should be CSS custom properties
            - Hard-coded brand names, account IDs, player IDs, or API keys in core block files
            - Hard-coded strings that should come from block content or authored config

            ### 2. Redundant Code
            - Logic duplicated across blocks that belongs in scripts/utils.js
            - CSS rules repeated across files that should be a shared token or utility class
            - Copy-pasted JS patterns that could be a shared helper function
            - Unused variables, imports, or dead code paths

            ### 3. CSS Best Practices
            - Raw values not using CSS custom properties (--color-*, --spacing-*, --body-font-size-*)
            - Inline style="" attributes (all styles must live in .css files)
            - Overly specific selectors (keep specificity flat)
            - Missing mobile-first responsive rules (base = mobile, media queries for desktop)
            - Unjustified !important usage
            - stylelint violations: wrong property order, no-descending-specificity
            - Missing CSS custom property fallbacks: var(--token, fallback)

            ### 4. JavaScript Best Practices
            - Missing await on async function calls
            - Missing try/catch around fetch(), external API calls, or JSON.parse()
            - Event listeners added without corresponding cleanup (removeEventListener)
            - Use of var instead of const or let
            - console.log or debug statements left in production code
            - Unused variables or parameters (prefix unused params with _)
            - Functions longer than 50 lines that should be split
            - Missing null/undefined checks before accessing properties

            ### 5. EDS Block Standards
            - Every block JS must export: export default function decorate(block)
            - Block JS must only query within its own element (block.querySelector not document.querySelector)
            - No document.write() or innerHTML with unsanitised input (XSS risk)
            - block.replaceChildren() preferred over innerHTML for structural rewrites
            - IntersectionObserver must be disconnected after triggering
            - Blocks must handle missing DOM elements defensively

            ### 6. Multi-Brand CSS Architecture
            - Core block CSS must be completely brand-agnostic
            - Brand styles must ONLY live in blocks/[block]/[brand]/[block].css
            - Theme styles must ONLY live in blocks/[block]/[brand]/[theme].css
            - No brand name strings hardcoded in core block files
            - CSS custom properties must cascade: brand token → global token → hardcoded fallback
            - Brand override files must not duplicate the entire core stylesheet

            ### 7. Design Tokens
            - Colors must use --color-* tokens, never raw hex (#xxx)
            - Spacing must use --spacing-* tokens or CSS calc() based on tokens
            - Typography must use --body-font-size-*, --heading-font-size-*, --font-weight-*
            - New CSS custom properties must have a fallback value

            ### 8. Navigation & Header Block Rules
            - navigation-content block types must match values in _navigation-content.json:
              logo, navigation-item, language-links, search, utility-nav, eyebrow, floating-isi, cta-group
            - Header layout variants (lite, sticky) must only be set via classes_layout / classes_sticky
            - No direct manipulation of the <header> element outside header.js

            ### 9. Block JSON Model (_block.json)
            - Every field read in JS must have a matching entry in _block.json models array
            - Every new field in JS must also be in the model and vice versa
            - filter definitions must reference component IDs that exist in definitions array
            - Default values in JSON template must match what JS expects when field is empty

            ### 10. Performance
            - No synchronous fetch in decorate() — all network calls must be async
            - Above-fold images: loading="eager" and fetchpriority="high"
            - Below-fold images: loading="lazy"
            - No render-blocking scripts or stylesheets loaded inside decorate()
            - Large dependencies (Brightcove SDK, third-party scripts) must be lazy-loaded

            ### 11. Accessibility
            - Interactive elements must have accessible labels (aria-label or visible text)
            - Images must have meaningful alt text
            - Custom interactive elements must use <button> or proper role + keyboard handler
            - Focus management must be correct when modals or panels open/close

            ### 12. Security
            - No API keys, tokens, or secrets in any committed file
            - No eval() or new Function() usage
            - User-supplied content must be sanitised before DOM insertion
            - No javascript: protocol in links

            ---

            ## Output Format

            Post **inline comments** on the exact diff lines with issues. Each comment must include:
            - The rule violated
            - What the problem is
            - A concrete fix or suggestion

            Then post a **summary PR comment**:

            ### Claude EDS Code Review Summary

            **✅ Looks good**
            - (what was done correctly)

            **⚠️ Warnings** (should fix before merge)
            - (non-blocking issues)

            **❌ Blockers** (must fix before merge)
            - (security, hard-coded secrets, broken block model, XSS)

            **📋 Blocks reviewed**
            - List each changed block and whether it passes EDS standards.

          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Read,Glob,Grep"
