name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove node_modules symlinks (workaround for anthropics/claude-code-action#1205)
        run: find . -path "*/node_modules/.bin/*" -type l -delete

      - name: Run Claude PR Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Step 1 — run exactly one command to get the full diff:
              gh pr diff ${{ github.event.pull_request.number }}

            Step 2 — analyse the diff in memory against the rules below. Do NOT read individual files unless a rule check is impossible without full file context.

            Step 3 — post ALL inline comments in a single batch using mcp__github_inline_comment__create_inline_comment (confirmed: true). Only comment on lines that are in the diff (+lines). Skip lines with no issues.

            Step 4 — post ONE summary comment using: gh pr comment ${{ github.event.pull_request.number }} --body "..."

            ---

            EDS MULTI-BRAND RULES (check only what is visible in the diff):

            HARD CODING: no hex colors, px values, absolute URLs, brand names, API keys, or account IDs in core block files. Use CSS custom properties and relative paths.

            CSS: all values via --color-*, --spacing-*, --body-font-size-* tokens with fallbacks var(--token, fallback). No inline style= attributes. Mobile-first (base = mobile, @media for desktop). No unjustified !important. Flat specificity.

            JS: const/let only (no var). await on all async calls. try/catch around fetch() and JSON.parse(). No console.log. null-check before property access. No innerHTML with unsanitised input.

            EDS BLOCK STANDARDS: export default function decorate(block). Query only within block (block.querySelector not document.querySelector). Disconnect IntersectionObserver after use. Handle missing DOM elements.

            MULTI-BRAND ARCHITECTURE: core block CSS brand-agnostic. Brand styles only in blocks/[block]/[brand]/[block].css. No brand names in core files.

            BLOCK JSON MODEL: every field read in JS must exist in _block.json models array and vice versa.

            SECURITY: no API keys or secrets in any file. No eval(). Sanitise user content before DOM insertion.

            ---

            SUMMARY FORMAT (post via gh pr comment):

            ### Claude EDS Code Review

            **Blockers** (must fix before merge)
            - <issue> — <file>:<line>

            **Warnings** (should fix)
            - <issue> — <file>:<line>

            **Looks good**
            - <what passed>

            **Blocks reviewed:** <list each changed block — pass/fail>

          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(git log:*),Read"
        env:
          INPUT_MAX_TURNS: "10"
