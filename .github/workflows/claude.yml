name: Claude PR Review

on:
  workflow_dispatch:
  pull_request:
    branches: [main,develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.repository == 'Nishant-Adobe/abbvie-eds-poc'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            The PR branch is already checked out in the current working directory.

            Use mcp__github_inline_comment__create_inline_comment
            with confirmed: true for line-specific issues.

            Use gh pr comment for summary feedback if needed.
              Focus ONLY on:
              - correctness bugs
              - security issues
              - breaking changes
              - obvious performance problems
              Use inline comments only for actionable issues.
              Keep the review concise.
            /code-review ${{ github.event.pull_request.number }}

          claude_args: |
            --max-turns 100
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Read,Glob,Grep"
